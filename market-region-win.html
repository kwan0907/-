<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SmartBet｜D 分池校準・WIN 賠率排序</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7f9}iframe{display:block;width:100%;height:100%;height:100dvh;border:0}#notice{position:fixed;inset:0;display:grid;place-items:center;background:#f5f7f9;font:16px system-ui;color:#195c91}#notice[hidden]{display:none}</style></head><body><div id="notice" role="status">正在載入 WIN 賠率排序…</div><iframe id="lab" title="D 分池校準－WIN 賠率由低至高排列"></iframe><script>
(()=>{'use strict';const target=new URL('/market-region-lab.html',location.origin);const given=new URLSearchParams(location.search);for(const key of ['date','venue','race'])if(given.has(key))target.searchParams.set(key,given.get(key));const frame=document.getElementById('lab');const notice=document.getElementById('notice');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const order=doc&&doc.getElementById('order');if(!order)throw Error('找不到排序控制');order.value='win';order.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));notice.hidden=true;}catch(e){notice.textContent='排序尚未套用：請於「柱圖排序」選擇 WIN 熱門→冷門。';notice.style.inset='auto 12px 12px';notice.style.padding='9px';notice.style.background='#fff';notice.style.border='1px solid #ddd';notice.style.fontSize='12px';}});frame.src=target.href;})();
</script></body></html>
