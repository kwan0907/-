<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#526b79"><title>SmartBet 數據庫｜市場資金分析</title><style>:root{font-family:Arial,'PingFang TC','Microsoft JhengHei',sans-serif;color:#263541;background:#f7f9fa}*{box-sizing:border-box}body{margin:0}header{background:#526b79;color:white;padding:12px max(14px,calc((100vw - 1280px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header a{color:#fff;text-decoration:none;font-weight:bold}main{max-width:1280px;padding:15px;margin:auto}h1{font-size:22px;color:#436073;margin:0}h2{font-size:20px;color:#14558f;font-weight:500;text-align:center;margin:9px 0 14px}.sub{color:#657783;font-size:12px}.controls{display:flex;align-items:end;flex-wrap:wrap;gap:8px;margin:13px 0}.controls label{font-size:12px;color:#526779;display:grid;gap:3px}button,input,select{font:inherit}input[type=date],select,.controls button,.tabs button,.filters button{padding:7px 9px;background:white;border:1px solid #b7c4cc;border-radius:4px;color:#283c49;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.controls button.active,.tabs button.active,.filters button.active{background:#e6f3df;border-color:#8bab84}.status{font-size:12px;color:#566d7b;margin:8px 0 13px;min-height:18px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{border:1px solid #d9e2e7;background:white;border-radius:6px;padding:10px;min-width:0}.chart{height:300px;position:relative;margin:0 0 8px 31px;border-left:1px solid #a8b3bd;border-bottom:1px solid #a8b3bd;background:repeating-linear-gradient(to top,transparent 0,transparent 49px,#e0e4e8 50px)}.bars{height:100%;display:flex;align-items:end;gap:4px;padding:0 5px}.barcol{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;text-align:center;position:relative;cursor:default}.bar{height:var(--h);min-height:3px;background:#ffead9;border:1px solid #ff8b32;position:relative}.bar strong{position:absolute;bottom:3px;left:0;right:0;font-size:12px;color:#1c2731}.bar i{position:absolute;bottom:0;left:0;right:0;height:5px;background:#18892b}.bubble{position:absolute;bottom:calc(var(--h) + 6px);left:50%;transform:translateX(-50%);border:1.5px solid #283541;border-radius:30px;min-width:30px;height:30px;display:grid;place-items:center;background:white;font-size:10px;font-weight:bold;z-index:1}.bubble.red{background:#cb1313;color:white}.under{font-size:11px;line-height:1.55;text-align:center;margin-left:31px}.under .row{display:flex;gap:4px;padding:0 5px}.under .row span{flex:1;min-width:0;overflow:hidden;white-space:nowrap}.under .row span:first-child{font-weight:bold}.slider{display:flex;align-items:center;gap:8px;margin:13px 0 6px}.slider input{width:100%;min-width:20px;accent-color:#207cbb}.slider button{border:0;background:#537584;color:white;border-radius:22px;width:34px;height:34px;flex-shrink:0;cursor:pointer}.timechip{background:#168321;color:#fff;font-weight:bold;padding:8px;white-space:nowrap;font-size:12px}.tabs,.filters{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.filters button{background:#158220;color:white;font-weight:bold;border-color:#158220}.filters button.active{background:#0b5614;color:#fff}.note{font-size:11px;line-height:1.55;color:#606e79;margin:7px 0}.scroll{width:100%;overflow:auto}.spectrum{border-collapse:collapse;width:100%;font-size:10px;table-layout:fixed}.spectrum th,.spectrum td{padding:2px 1px;border-bottom:1px solid #d5d9de;text-align:center;white-space:nowrap}.spectrum th:nth-child(1){width:24px}.spectrum th:nth-child(2),.spectrum th:nth-child(3){width:33px}.spectrum th{font-weight:normal}.spectrum td.gridcell{padding:1px;min-width:12px}.stripe{display:block;height:3px;margin:1px 0;background:#e0e2e4}.stripe.g{background:#c6e4ca}.stripe.p{background:#e9a0a4}.stripe.o{background:#aa3b0c}.legend{font-size:11px;display:flex;flex-wrap:wrap;gap:8px;color:#53616b;margin:10px 0 5px}.sw{display:inline-block;width:11px;height:10px;vertical-align:-1px;margin-right:3px;background:#e0e2e4}.sw.g{background:#c6e4ca}.sw.p{background:#e9a0a4}.sw.o{background:#aa3b0c}.scrolltable{max-height:370px;overflow:auto;border:1px solid #d5dce2}.datatable{border-collapse:collapse;width:100%;font-size:12px}.datatable th{background:#175e9b;color:white;position:sticky;top:0;font-weight:500}.datatable td,.datatable th{border:1px solid #d4dbe2;padding:6px 4px;text-align:center;white-space:nowrap}.datatable tr:nth-child(even){background:#f4f7f9}.empty{color:#6b7880;padding:23px 8px;text-align:center;font-size:12px}.rightstats{min-height:220px}footer{font-size:11px;color:#7c8991;margin:18px 0 26px;text-align:center}@media(max-width:800px){main{padding:9px}.layout{grid-template-columns:1fr}.panel{padding:7px}h2{font-size:17px}.chart{height:245px;margin-left:20px}.bars{gap:2px;padding:0 2px}.under{margin-left:20px}.under .row{gap:2px;padding:0 2px}.under .row span,.bar strong{font-size:9px}.bubble{min-width:22px;height:23px;font-size:9px}.spectrum{font-size:9px}.spectrum td.gridcell{min-width:10px}.datatable{font-size:11px}.scrolltable{max-height:320px}}@media(max-width:350px){.bubble{font-size:8px;min-width:19px;height:21px}.spectrum{font-size:8px}}</style></head><body><header><a href="/">♞ SmartBet HK</a><span>數據庫 · 資金分析</span></header><main><h1>賽事數據庫</h1><p class="sub">同一場次同步顯示熱錢柱圖、WQQP 頻譜、可核實異動及賽果；缺失數據不會補造。</p><div class="controls"><label>日期<input id="date" type="date"></label><label>場地<select id="venue"><option value="HV">跑馬地</option><option value="ST">沙田</option></select></label><label>場次<select id="race"></select></label><button id="prev">上一日</button><button id="next">下一日</button><button id="load" class="active">讀取賽事</button><button id="latest">最新快照</button><button id="results">官方賽果</button><a href="/" style="font-size:12px;color:#23649d">返回 SmartBet</a></div><div id="status" class="status" role="status">正在準備資料…</div><div class="layout"><section class="panel"><h2 id="barTitle">即時熱錢分佈</h2><div class="chart"><div id="bars" class="bars"></div></div><div id="under" class="under"></div><div class="slider"><span class="timechip" id="clock">—</span><button id="back" aria-label="上一個快照">‹</button><input id="seek" type="range" min="0" max="0" value="0" aria-label="歷史快照"><button id="forward" aria-label="下一個快照">›</button></div><div id="barNote" class="note"></div></section><section class="panel"><h2>WQQP% 頻譜</h2><div class="scroll"><table class="spectrum" id="spec"></table></div><div class="legend"><span>每行三格：W／Q／QP</span><span><i class="sw"></i>＜10%</span><span><i class="sw g"></i>10～20%</span><span><i class="sw p"></i>20～30%</span><span><i class="sw o"></i>＞30%</span></div><div class="tabs" id="specTabs"><button data-mode="freq" class="active">WQQP%</button><button data-mode="diff">QQPL異常</button><button data-mode="pre">沙圈前</button><button data-mode="overnight">隔夜飛</button></div><p id="specNote" class="note"></p></section><section class="panel"><div class="filters" id="filters"><button data-pool="ALL" class="active">全部</button><button data-pool="WIN">W</button><button data-pool="PLA">P</button><button data-pool="QIN">Q</button><button data-pool="QPL">QP</button><button data-pool="DBL">D</button></div><div class="scrolltable"><table class="datatable"><thead><tr><th>時間</th><th>類別</th><th>馬號／組合</th><th>賠率變化</th><th>投注額變化</th></tr></thead><tbody id="flowRows"></tbody></table></div><p class="note" id="flowNote"></p></section><section class="panel"><div class="tabs" id="detailTabs"><button data-detail="signals" class="active">跨池異常</button><button data-detail="finish">賽果／派彩</button><button data-detail="tickets">逐注投注</button></div><div class="scrolltable rightstats"><table class="datatable"><thead id="detailHead"></thead><tbody id="detailRows"></tbody></table></div><p id="detailNote" class="note"></p></section></div><footer>資料：SmartBet 已保存 HKJC 公開彩池快照／官方賽果。個別馬匹流入與柱高為估算，並非實際逐注投注額或勝率。</footer></main><script src="/market-desk.js?v=1" defer></script></body></html>
